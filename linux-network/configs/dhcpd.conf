# Глобальные настройки
default-lease-time 600;
max-lease-time 7200;

# Настройка локальной подсети (Internal Network)
subnet 192.168.56.0 netmask 255.255.255.0 {
    # Диапазон IP-адресов для раздачи
    range 192.168.56.150 192.168.56.200;
    
    # Шлюз по умолчанию
    option routers 192.168.56.2;
    
    # DNS-сервер
    option domain-name-servers 192.168.56.2;
    
    # Домен
    option domain-name "example.org";
}

# Привязка IP к MAC-адресу для сервера
host share {
    hardware ethernet 08:00:27:bd:79:c8; 
    fixed-address 192.168.56.2;
    option routers 192.168.56.2;
    option domain-name-servers 192.168.56.2;
    option subnet-mask 255.255.255.0;
    option domain-name "example.org";
}

# Глобальные настройки (секция [global])
[global]
   workgroup = WORKGROUP
   server string = %h server (Samba, Ubuntu)
   
   # Максимальная совместимость со старыми клиентами SMB
   server min protocol = NT1

# Общие папки (Гостевой доступ)

# Папка с правами на чтение и запись (777)
[share]
   path = /home/samba/share
   writable = yes
   guest ok = yes
   guest only = yes
   create mode = 0777
   directory mode = 0777

# Папка только для чтения (read-only)
[readShare]
   path = /home/samba/read-only
   writable = no
   guest ok = yes
   guest only = yes

# Разграничение прав для пользователей

# Доступ только для пользователя user1
[user1]
   create mask = 0777
   directory mask = 0777
   path = /home/samba/user1
   read only = No
   valid users = user1

# Доступ на чтение для user1, запись только для user2
[user2]
   create mask = 0777
   directory mask = 0777
   path = /home/samba/user2
   read list = user1
   write list = user2
